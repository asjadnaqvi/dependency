name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Verify LFS payloads are materialized
        run: |
          git lfs ls-files
          test ! -f dependency/data/metadata.json || ! grep -q 'git-lfs.github.com/spec/v1' dependency/data/metadata.json
          test ! -f dependency/data/hs2/01.json || ! grep -q 'git-lfs.github.com/spec/v1' dependency/data/hs2/01.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dependency

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
